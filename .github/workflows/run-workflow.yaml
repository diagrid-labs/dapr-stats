name: Run CollectorWorkflow

on:
  schedule:
    # Run at 09:43 CET (08:43 UTC) every Monday. Deliberately off the top of
    # the hour: GitHub delays or drops scheduled runs under load, and the start
    # of every hour is the worst slot for it.
    - cron: '43 8 * * 1'
  workflow_dispatch:
    # NOTE: workflow_dispatch allows at most 10 inputs.
    #
    # The package lists take `all` / `none` / an explicit `<eco>:<list>` group
    # rather than being prefilled with the default list. Clearing a text input
    # does NOT submit an empty value: GitHub substitutes the input's default,
    # so an emptied field is indistinguishable from an omitted one and silently
    # collected everything. `none` is a value GitHub cannot override, so that
    # is how a list -- or every list -- is skipped.
    # The lists themselves live in the DEFAULT_* env values below, once.
    inputs:
      packages:
        description: 'Packages: all | none | <eco>:<list> groups separated by ; (eco = nuget, npm, python, java). Naming any group skips every ecosystem you do not name. Example: nuget:Dapr.Client,Dapr.Jobs;java:all'
        required: false
        type: string
        default: 'all'
      collect_dockerhub:
        description: 'Collect Docker Hub image pulls'
        required: false
        type: boolean
        default: true
      collect_datadog:
        description: 'Collect Datadog RUM views, users and identified users'
        required: false
        type: boolean
        default: true
      collect_scarf:
        description: 'Scarf pixel events: all accounts, neither, or one'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - none
          - dapr
          - diagrid
      collect_discord:
        description: 'Collect Discord data'
        required: false
        type: boolean
        default: true
      collect_github:
        description: 'Collect GitHub data for the dapr org'
        required: false
        type: boolean
        default: true
      collect_diagrid_dashboard:
        description: 'Collect Diagrid dashboard data'
        required: false
        type: boolean
        default: true
      skip_storage:
        description: 'Dry run: fetch everything but do not write to the database'
        required: false
        type: boolean
        default: false

env:
  POSTGRESQLCONNECTION: ${{ secrets.POSTGRESQLCONNECTION }}
  DAPRSTATSGITHUBPAT: ${{ secrets.DAPRSTATSGITHUBPAT }}
  DISCORDBOTTOKEN: ${{ secrets.DISCORDBOTTOKEN }}
  DAPRDISCORDSERVERID: ${{ secrets.DAPRDISCORDSERVERID }}
  DATADOGAPIKEY: ${{ secrets.DATADOGAPIKEY }}
  DATADOGAPPKEY: ${{ secrets.DATADOGAPPKEY }}
  SCARF_DAPR_API_TOKEN: ${{ secrets.SCARF_DAPR_API_TOKEN }}
  SCARF_DIAGRID_API_TOKEN: ${{ secrets.SCARF_DIAGRID_API_TOKEN }}

  # The one place the package lists are defined. Used by scheduled runs and by
  # a manual run that leaves a package input set to `all`.
  DEFAULT_NUGET_PACKAGES: 'Dapr.Client,Dapr.Workflow,Dapr.AspNetCore,Dapr.Extensions.Configuration,Dapr.Actors,Dapr.Messaging,Dapr.Jobs,CommunityToolkit.Aspire.Hosting.Dapr,Diagrid.AI.Microsoft.AgentFramework'
  DEFAULT_NPM_PACKAGES: '@dapr/dapr'
  DEFAULT_PYTHON_PACKAGES: 'dapr,dapr-agents,dapr-ext-workflow,diagrid'
  DEFAULT_JAVA_PACKAGES: 'io.dapr*'

  # Not exposed as dispatch inputs (10-input cap); switched on and off by the
  # collect_dockerhub and collect_datadog checkboxes and by the collect_scarf
  # choice.
  FIXED_DOCKERHUB_IMAGES: 'daprio/daprd,daprio/scheduler,daprio/operator,daprio/injector,daprio/sentry,daprio/placement'
  FIXED_DATADOG_RUM_SERVICES: 'dev-dashboard'
  FIXED_DATADOG_IDENTIFIED_SERVICES: 'conductor-ui|conductor.r1.diagrid.io,conductor-ui|dapr-ops-dashboard.diagrid.io'
  FIXED_SCARF_BUILDINGBLOCK_PIXEL_IDS: '4848fb3b-3edb-4329-90a9-a9d79afff054'
  FIXED_SCARF_LEADERBOARD_PIXEL_IDS: '4848fb3b-3edb-4329-90a9-a9d79afff054,0f63416a-15c2-4ccd-bae0-001898f75f8f'
  FIXED_SCARF_DIAGRID_PAGE_PIXEL_IDS: '0a39aa4e-64f2-4851-8a94-2c3417c264ae,030637aa-5521-4cbd-b1b7-3f9f97865a0e'

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dapr CLI
        run: |
          wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash
          dapr --version

      - name: Initialize Dapr
        run: dapr init

      - name: Build .NET Project
        run: dotnet build CollectDaprStats/CollectDaprStats.csproj

      - name: Start Application with Dapr
        run: |
          set -e
          # Redirect rather than letting daprd write straight to this step's
          # stdout: the step's log window closes when the step ends, so
          # everything daprd and the app print during the collection that
          # follows is lost. On 2026-09-21 the app crashed inside this window
          # and was diagnosable only by luck; five seconds later it would have
          # left no trace. The "Dump Dapr and app logs" step reads this file,
          # and the startup output is echoed back below so it still shows up
          # here, where it matters most.
          dapr run -f . > dapr.log 2>&1 &
          DAPR_PID=$!
          echo "dapr_pid=$DAPR_PID" >> $GITHUB_ENV
          echo "Dapr multi-app started in background with PID: $DAPR_PID"

          # `dapr run` stays alive even when daprd and the app have both died, so
          # checking the PID proves nothing. Poll the sidecar until it actually
          # serves, which also covers a slow Neon cold start behind the postgres
          # binding's initTimeout.
          #
          # The deadline is the real backstop here, not the `kill -0` branch:
          # per the comment above the CLI does not exit when the stack under it
          # dies, so that branch fires only if the CLI itself is killed.
          dump_log() {
            echo "::group::Dapr startup output"
            cat dapr.log 2>/dev/null || echo "(no dapr.log)"
            echo "::endgroup::"
          }

          DEADLINE=$((SECONDS + 180))
          until curl -sf -o /dev/null http://localhost:3500/v1.0/healthz; do
            if ! kill -0 $DAPR_PID 2>/dev/null; then
              echo "❌ Dapr process exited before the sidecar became healthy"
              dump_log
              exit 1
            fi
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "❌ Sidecar did not become healthy within 180s"
              dump_log
              exit 1
            fi
            sleep 5
          done
          echo "✅ Dapr sidecar and app are healthy"
          dump_log

      - name: Generate Variables and Start CollectorWorkflow
        id: start-workflow
        # Everything in this step is near-instant apart from one curl that is
        # itself capped at 60s, so three minutes is pure slack. Without it a
        # hang here eats the whole 30-minute job budget and the run is
        # cancelled rather than failed -- no error, no logs, no artifacts.
        timeout-minutes: 3
        env:
          # Empty on scheduled runs; the script then falls back to the defaults.
          IN_PACKAGES: ${{ inputs.packages }}
          IN_COLLECT_DOCKERHUB: ${{ inputs.collect_dockerhub }}
          IN_COLLECT_DATADOG: ${{ inputs.collect_datadog }}
          IN_COLLECT_SCARF: ${{ inputs.collect_scarf }}
          IN_COLLECT_DISCORD: ${{ inputs.collect_discord }}
          IN_COLLECT_GITHUB: ${{ inputs.collect_github }}
          IN_COLLECT_DIAGRID_DASHBOARD: ${{ inputs.collect_diagrid_dashboard }}
          IN_SKIP_STORAGE: ${{ inputs.skip_storage }}
        run: |
          set -euo pipefail

          # Booleans only. An unchecked box submits a real `false`, which GitHub
          # does not replace with the input's default, so a manual run's value
          # always wins. Other triggers carry no inputs and use the default.
          pick() {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              printf '%s' "$1"
            else
              printf '%s' "$2"
            fi
          }

          # The `packages` input: `all` | `none` | `<eco>:<list>` groups joined
          # by `;`. A text input cannot use the boolean trick -- clearing a
          # field makes GitHub substitute the default, so an emptied field is
          # indistinguishable from an omitted one. `none` is the only value
          # GitHub cannot override, so that is how a list is skipped.
          #
          # Naming ANY group skips every ecosystem not named. A group string is
          # written to re-run something specific; quietly collecting four other
          # ecosystems alongside it is the failure that made `none` a keyword.
          #   $1 = ecosystem key (lowercase), $2 = that ecosystem's default list
          resolve_group() {
            local key="$1" default="$2"
            local spec keyword group gkey glist
            spec="$(printf '%s' "${IN_PACKAGES:-}" | tr -d '[:space:]')"
            keyword="$(printf '%s' "$spec" | tr '[:upper:]' '[:lower:]')"

            case "$keyword" in
              ''|all) printf '%s' "$default"; return ;;
              none)   printf '%s' ''; return ;;
            esac

            # Globbing is off for the word-split below: DEFAULT_JAVA_PACKAGES
            # is `io.dapr*`, and an unquoted `*` in $spec must stay the
            # literal character it is, not expand to a filename from the
            # working directory. Every path out of this loop restores it
            # before returning, since resolve_group's caller relies on the
            # option being back to its normal state.
            set -f
            local IFS=';'
            for group in $spec; do
              gkey="$(printf '%s' "${group%%:*}" | tr '[:upper:]' '[:lower:]')"
              [ "$gkey" = "$key" ] || continue

              glist="${group#*:}"
              case "$(printf '%s' "$glist" | tr '[:upper:]' '[:lower:]')" in
                all)  printf '%s' "$default" ;;
                none) printf '%s' '' ;;
                # Package names keep their original case: NuGet ids are
                # case-sensitive.
                *)    printf '%s' "$glist" ;;
              esac
              set +f
              return
            done

            set +f
            printf '%s' ''
          }

          # Validates the whole `packages` spec once, before resolve_group runs
          # once per ecosystem and would otherwise repeat the same complaint
          # four times. resolve_group's own parsing is deliberately permissive
          # (it has to accept `all`/`none` in any case and bare package
          # lists), which means a malformed group is otherwise silently
          # misread rather than rejected:
          #   - a bare token with no ':' (e.g. `nuget` instead of `nuget:all`)
          #     makes both `${group%%:*}` and `${group#*:}` yield the whole
          #     token, so if it happens to equal the ecosystem key being
          #     resolved, that ecosystem silently "collects" a package
          #     literally named after the key instead of a real list;
          #   - a typoed ecosystem key (e.g. `jva:all`) matches no ecosystem,
          #     so every ecosystem silently resolves to "collect nothing" --
          #     a run that reports success but stores no package data at all.
          # This file has already shipped a silent wrong-collection bug twice
          # (see AGENTS.md); a plausible typo must fail loudly, not quietly.
          validate_packages_spec() {
            local spec keyword group gkey glist matched
            spec="$(printf '%s' "${IN_PACKAGES:-}" | tr -d '[:space:]')"
            keyword="$(printf '%s' "$spec" | tr '[:upper:]' '[:lower:]')"

            # Empty (scheduled runs), `all` and `none` need no further checks.
            case "$keyword" in
              ''|all|none) return 0 ;;
            esac

            matched=0
            # Globbing is off for the word-split below: DEFAULT_JAVA_PACKAGES
            # is `io.dapr*`, and an unquoted `*` in $spec must stay the
            # literal character it is, not expand to a filename from the
            # working directory. This function is called directly rather
            # than through a subshell, so every path out of the loop below
            # (including the error exits, harmless since exit ends the whole
            # step anyway) restores it before leaving.
            set -f
            local IFS=';'
            for group in $spec; do
              # Leading/trailing/doubled ';' produce empty tokens -- harmless.
              [ -z "$group" ] && continue
              matched=1

              case "$group" in
                *:*) ;;
                *)
                  set +f
                  echo "::error::packages: '$group' is missing ':' -- expected <eco>:<list> (eco = nuget, npm, python, java)" >&2
                  exit 1
                  ;;
              esac

              gkey="$(printf '%s' "${group%%:*}" | tr '[:upper:]' '[:lower:]')"
              glist="${group#*:}"

              case "$gkey" in
                nuget|npm|python|java) ;;
                *)
                  set +f
                  echo "::error::packages: '$group' names an unrecognised ecosystem '$gkey' -- expected one of nuget, npm, python, java" >&2
                  exit 1
                  ;;
              esac

              if [ -z "$glist" ]; then
                set +f
                echo "::error::packages: '$group' has no value after ':' -- expected all, none, or a comma-separated package list" >&2
                exit 1
              fi
            done
            set +f

            # Every token was empty -- e.g. ';;;', ';', '; ;'. Each was
            # skipped by the guard above, so nothing was ever rejected, and
            # every ecosystem would resolve to empty and the job would report
            # success having collected nothing. npm and PyPI only serve "last
            # week", so that silence is permanent data loss, not something a
            # later run repairs.
            if [ "$matched" -eq 0 ]; then
              echo "::error::packages: '$spec' names no ecosystem group -- expected all, none, or <eco>:<list> groups separated by ';'" >&2
              exit 1
            fi
          }

          norm_bool() {
            if [ "$1" = "true" ]; then echo true; else echo false; fi
          }

          # Which Scarf accounts to collect. A `choice` input always submits one
          # of its declared options, so unlike the package text fields it cannot
          # be silently replaced by its default -- but a scheduled run submits no
          # inputs at all, so the empty case still has to resolve to `all`.
          # Anything unrecognised also falls back to `all` rather than silently
          # collecting nothing.
          resolve_scarf() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
              none)    printf '%s' 'none' ;;
              dapr)    printf '%s' 'dapr' ;;
              diagrid) printf '%s' 'diagrid' ;;
              *)       printf '%s' 'all' ;;
            esac
          }

          # Trims each entry and drops blanks, so an empty list yields [].
          csv_to_json() {
            jq -nc --arg csv "$1" '$csv
              | split(",")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0))'
          }

          validate_packages_spec

          NUGET_CSV=$(resolve_group nuget "$DEFAULT_NUGET_PACKAGES")
          NPM_CSV=$(resolve_group npm "$DEFAULT_NPM_PACKAGES")
          PYTHON_CSV=$(resolve_group python "$DEFAULT_PYTHON_PACKAGES")
          JAVA_CSV=$(resolve_group java "$DEFAULT_JAVA_PACKAGES")

          COLLECT_DOCKERHUB=$(norm_bool "$(pick "$IN_COLLECT_DOCKERHUB" true)")
          COLLECT_DATADOG=$(norm_bool "$(pick "$IN_COLLECT_DATADOG" true)")
          SCARF_MODE=$(resolve_scarf "$IN_COLLECT_SCARF")
          COLLECT_DISCORD=$(norm_bool "$(pick "$IN_COLLECT_DISCORD" true)")
          COLLECT_GITHUB=$(norm_bool "$(pick "$IN_COLLECT_GITHUB" true)")
          COLLECT_DIAGRID=$(norm_bool "$(pick "$IN_COLLECT_DIAGRID_DASHBOARD" true)")
          SKIP_STORAGE=$(norm_bool "$(pick "$IN_SKIP_STORAGE" false)")

          # CollectorWorkflow skips any collector whose list is empty, so the
          # toggles are applied by blanking out the fixed lists.
          DOCKERHUB_CSV=""
          DATADOG_CSV=""
          DATADOG_ID_CSV=""
          SCARF_BB_CSV=""
          SCARF_LB_CSV=""
          SCARF_DIAGRID_CSV=""
          if [ "$COLLECT_DOCKERHUB" = "true" ]; then
            DOCKERHUB_CSV="$FIXED_DOCKERHUB_IMAGES"
          fi
          if [ "$COLLECT_DATADOG" = "true" ]; then
            DATADOG_CSV="$FIXED_DATADOG_RUM_SERVICES"
            DATADOG_ID_CSV="$FIXED_DATADOG_IDENTIFIED_SERVICES"
          fi
          # Scarf is per-account rather than a single on/off, so that one
          # account can be re-collected without rewriting the other's three
          # weeks. `dapr` covers both Dapr pixel lists; `diagrid` covers the
          # page-view pixels.
          case "$SCARF_MODE" in
            all)
              SCARF_BB_CSV="$FIXED_SCARF_BUILDINGBLOCK_PIXEL_IDS"
              SCARF_LB_CSV="$FIXED_SCARF_LEADERBOARD_PIXEL_IDS"
              SCARF_DIAGRID_CSV="$FIXED_SCARF_DIAGRID_PAGE_PIXEL_IDS"
              ;;
            dapr)
              SCARF_BB_CSV="$FIXED_SCARF_BUILDINGBLOCK_PIXEL_IDS"
              SCARF_LB_CSV="$FIXED_SCARF_LEADERBOARD_PIXEL_IDS"
              ;;
            diagrid)
              SCARF_DIAGRID_CSV="$FIXED_SCARF_DIAGRID_PAGE_PIXEL_IDS"
              ;;
            none)
              ;;
          esac

          # Generate random UUID for workflow_id
          WORKFLOW_ID=$(uuidgen)
          echo "workflow_id=$WORKFLOW_ID" >> $GITHUB_OUTPUT

          # Generate current ISO 8601 timestamp
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "current_date=$CURRENT_DATE" >> $GITHUB_OUTPUT

          PAYLOAD=$(jq -nc \
            --arg collectionDate "$CURRENT_DATE" \
            --argjson nuget "$(csv_to_json "$NUGET_CSV")" \
            --argjson npm "$(csv_to_json "$NPM_CSV")" \
            --argjson python "$(csv_to_json "$PYTHON_CSV")" \
            --argjson java "$(csv_to_json "$JAVA_CSV")" \
            --argjson dockerHub "$(csv_to_json "$DOCKERHUB_CSV")" \
            --argjson dataDog "$(csv_to_json "$DATADOG_CSV")" \
            --argjson dataDogIdentified "$(csv_to_json "$DATADOG_ID_CSV")" \
            --argjson scarfBuildingBlock "$(csv_to_json "$SCARF_BB_CSV")" \
            --argjson scarfLeaderboard "$(csv_to_json "$SCARF_LB_CSV")" \
            --argjson scarfDiagridPage "$(csv_to_json "$SCARF_DIAGRID_CSV")" \
            --argjson discord "$COLLECT_DISCORD" \
            --argjson github "$COLLECT_GITHUB" \
            --argjson diagrid "$COLLECT_DIAGRID" \
            --argjson skipStorage "$SKIP_STORAGE" \
            '{
              CollectionDate: $collectionDate,
              NuGetPackageNames: $nuget,
              NpmPackageNames: $npm,
              PythonPackageNames: $python,
              JavaPackageNames: $java,
              CollectDiscordData: $discord,
              CollectGitHubData: $github,
              CollectDiagridDashboardData: $diagrid,
              DockerHubImages: $dockerHub,
              DataDogRumServices: $dataDog,
              DataDogRumIdentifiedServices: $dataDogIdentified,
              ScarfBuildingBlockPixelIds: $scarfBuildingBlock,
              ScarfLeaderboardPixelIds: $scarfLeaderboard,
              ScarfDiagridPagePixelIds: $scarfDiagridPage,
              SkipStorage: $skipStorage
            }')

          echo "Starting workflow with ID: $WORKFLOW_ID"
          echo "Collection date: $CURRENT_DATE"
          echo "Payload:"
          echo "$PAYLOAD" | jq .

          {
            echo "### CollectorWorkflow input"
            echo ""
            echo '```json'
            echo "$PAYLOAD" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Make POST request to start the workflow
          # --max-time is load-bearing. daprd serves its HTTP API before the
          # app channel exists, so when the app has crashed this POST connects
          # happily and then blocks forever on a workflow engine with nothing
          # to schedule onto. Untimed, that burned the entire job budget on
          # 2026-09-21: 29 minutes of silence, then a cancellation.
          RESPONSE=$(curl -sS --max-time 60 -X POST "http://localhost:3500/v1.0/workflows/dapr/CollectorWorkflow/start?instanceID=$WORKFLOW_ID" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || {
            echo "❌ Could not reach the workflow start API (curl exit $?)"
            exit 1
          }

          echo "Response: $RESPONSE"

          # Extract instanceID from response
          INSTANCE_ID=$(echo "$RESPONSE" | jq -r '.instanceID // empty')
          if [ -z "$INSTANCE_ID" ]; then
            echo "❌ Failed to start CollectorWorkflow"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Instance ID: $INSTANCE_ID"

      - name: Wait for Workflow Completion
        id: check-status
        run: |
          INSTANCE_ID="${{ steps.start-workflow.outputs.instance_id }}"
          echo "Polling status for instance: $INSTANCE_ID"

          DEADLINE=$((SECONDS + 1500))   # 25 minutes
          STATUS="UNKNOWN"

          while [ $SECONDS -lt $DEADLINE ]; do
            STATUS=$(curl -s "http://localhost:3500/v1.0/workflows/dapr/$INSTANCE_ID" | jq -r '.runtimeStatus')
            echo "Workflow status: $STATUS"
            case "$STATUS" in
              COMPLETED|FAILED|TERMINATED) break ;;
            esac
            sleep 30
          done

          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Evaluate Result
        run: |
          STATUS="${{ steps.check-status.outputs.status }}"

          if [ "$STATUS" = "COMPLETED" ]; then
            echo "✅ Workflow completed successfully!"
            exit 0
          elif [ "$STATUS" = "FAILED" ]; then
            echo "❌ Workflow failed!"
            exit 1
          else
            echo "⚠️ Workflow status: $STATUS (not completed)"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Dapr processes..."
          dapr stop --app-id collect-dapr-stats || true
          pkill -f "dapr" || true
          echo "Cleanup complete"

      # After Cleanup, so every process has exited and written its last line.
      # Dumped into the step log rather than uploaded as an artifact: GitHub
      # masks registered secrets in step logs but not in artifacts, and this
      # repository is public.
      - name: Dump Dapr and app logs
        if: always()
        run: |
          echo "::group::dapr.log"
          cat dapr.log 2>/dev/null || echo "(no dapr.log)"
          echo "::endgroup::"

          for f in CollectDaprStats/.dapr/logs/*; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
